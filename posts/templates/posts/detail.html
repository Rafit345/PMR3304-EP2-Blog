{% extends 'base.html' %}

{% block title %}
{{ post.title }}
{% endblock title %}

{% block content %}
<article class="page-content">
    <div class="eyebrow">POST</div>
    <h1>{{ post.title }}</h1>
    <p class="lead">Postado em {{ post.date|date:"d/m/Y \à\s H:i" }}</p>
    <ul class="acoes">
        <li><a href="{% url 'posts:update' post.id %}">Editar</a></li>
        <li><a href="{% url 'posts:delete' post.id %}">Apagar</a></li>
    </ul>
    <div class="content-flow">
        {{ post.content|safe }}
    </div>
    <p><a class="text-link" href="{% url 'posts:index' %}">← Voltar para a lista de posts</a></p>
</article>
{% endblock content %}
