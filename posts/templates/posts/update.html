{% extends 'base.html' %}

{% block title %}
Editar {{ post.title }}
{% endblock title %}

{% block content %}
<section class="page-content">
    <h1>Editar Post</h1>
    <form method="post" action="{% url 'posts:update' post.id %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Atualizar</button>
    </form>
    <p><a class="text-link" href="{% url 'posts:detail' post.id %}">← Voltar para o post</a></p>
</section>
{% endblock content %}
