{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %} | Rafael Colombini Fernandes
    </title>
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
</head>

<body>
    <header id="cabecalho-principal">
        <div class="site-brand">
            <a href="{% url 'index' %}">
                <img src="{% static 'rafael-logo.jpg' %}" alt="Logo de Rafael Colombini Fernandes">
            </a>
            <p>Rafael Colombini Fernandes</p>
        </div>
        <nav id="navegacao-principal">
            <ul>
                <li><a href="{% url 'index' %}">Home</a></li>
                <li><a href="{% url 'about' %}">Sobre</a></li>
                <li><a href="{% url 'posts:index' %}">Posts</a></li>
            </ul>
        </nav>
    </header>
    <main id="conteiner-principal">
        {% block content %}{% endblock %}
    </main>
    <footer id="rodape-principal">
        <p>Rafael Colombini Fernandes · São Paulo, Brasil</p>
        <a href="mailto:rafaelcolombinif@usp.br">rafaelcolombinif@usp.br</a>
    </footer>
</body>

</html>
